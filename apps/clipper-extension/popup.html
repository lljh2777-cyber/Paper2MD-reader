<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>After-MinerU Companion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="clipper-shell">
      <header>
        <strong>After‑MinerU Companion</strong>
        <span>网页剪藏与精准转换</span>
      </header>
      <p id="page-title" class="page-title">正在读取当前页面…</p>
      <p class="privacy-note">内容在浏览器内确定性整理并可直接下载 ZIP；图片按域名请求权限，不调用 AI，也不会发送到 Paper2MD 云端。</p>
      <button id="precision-button" type="button">精准转换 PDF（实验性）</button>
      <button id="export-button" type="button">生成 ZIP 并下载</button>
      <button id="clip-button" class="secondary" type="button" disabled>发送到桌面版（需本机配对）</button>
      <section id="pairing" class="pairing" hidden>
        <input id="pairing-id" type="text" placeholder="Reader 中显示的配对 ID" autocomplete="off" />
        <input id="pairing-code" type="text" inputmode="numeric" maxlength="8" placeholder="8 位配对码" autocomplete="one-time-code" />
        <button id="pair-button" class="secondary" type="button">完成本机配对</button>
      </section>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
