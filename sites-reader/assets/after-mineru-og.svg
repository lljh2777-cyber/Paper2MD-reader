<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">After-MinerU local paper workbench</title>
  <desc id="desc">A synthetic three-column paper reader preview showing an outline, article text, and figure panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e7f0fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#1769c2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b2545" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="28" r="180" fill="#d8e8fb" opacity="0.75"/>
  <circle cx="90" cy="610" r="210" fill="#e6f5ee" opacity="0.8"/>

  <text x="72" y="88" fill="#1769c2" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">LOCAL PAPER WORKBENCH</text>
  <text x="72" y="158" fill="url(#brand)" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="700">After-MinerU</text>
  <text x="72" y="201" fill="#506b88" font-family="Segoe UI, Arial, sans-serif" font-size="24">by Paper2MD · Unofficial</text>
  <text x="72" y="265" fill="#0b2545" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="650">Convert. Read. Export.</text>
  <text x="72" y="307" fill="#506b88" font-family="Segoe UI, Arial, sans-serif" font-size="22">No hosted paper library.</text>
  <text x="72" y="339" fill="#506b88" font-family="Segoe UI, Arial, sans-serif" font-size="22">Source files stay unchanged.</text>

  <g transform="translate(540 106) scale(0.8)" filter="url(#shadow)">
    <rect width="718" height="474" rx="24" fill="#ffffff" stroke="#cbdced" stroke-width="2"/>
    <rect width="718" height="54" rx="24" fill="#eef4fb"/>
    <rect y="30" width="718" height="24" fill="#eef4fb"/>
    <circle cx="28" cy="27" r="7" fill="#ff8c79"/>
    <circle cx="52" cy="27" r="7" fill="#f4c95d"/>
    <circle cx="76" cy="27" r="7" fill="#69c58a"/>
    <text x="112" y="34" fill="#0b2545" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650">After-MinerU Reader</text>

    <rect x="0" y="54" width="150" height="420" fill="#f7faff"/>
    <text x="22" y="92" fill="#1769c2" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">OUTLINE</text>
    <rect x="16" y="114" width="118" height="36" rx="9" fill="#e2efff"/>
    <text x="28" y="137" fill="#0b2545" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650">01  Abstract</text>
    <text x="28" y="178" fill="#627b95" font-family="Segoe UI, Arial, sans-serif" font-size="14">02  Methods</text>
    <text x="28" y="217" fill="#627b95" font-family="Segoe UI, Arial, sans-serif" font-size="14">03  Results</text>
    <text x="28" y="256" fill="#627b95" font-family="Segoe UI, Arial, sans-serif" font-size="14">04  Figures</text>
    <text x="28" y="295" fill="#627b95" font-family="Segoe UI, Arial, sans-serif" font-size="14">05  References</text>

    <rect x="150" y="54" width="372" height="420" fill="#ffffff"/>
    <text x="184" y="104" fill="#1769c2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">METHODS</text>
    <text x="184" y="143" fill="#0b2545" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="700">Structured reading</text>
    <rect x="184" y="169" width="298" height="8" rx="4" fill="#d7e1ec"/>
    <rect x="184" y="190" width="276" height="8" rx="4" fill="#d7e1ec"/>
    <rect x="184" y="211" width="310" height="8" rx="4" fill="#d7e1ec"/>
    <rect x="184" y="232" width="236" height="8" rx="4" fill="#d7e1ec"/>
    <rect x="184" y="270" width="304" height="132" rx="14" fill="#edf5ff" stroke="#c9def5"/>
    <polyline points="212,365 258,337 304,350 352,302 398,319 454,286" fill="none" stroke="#1769c2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="352" cy="302" r="8" fill="#1ba36a"/>
    <text x="184" y="431" fill="#627b95" font-family="Segoe UI, Arial, sans-serif" font-size="13">Figure 1 · deterministic projection</text>

    <rect x="522" y="54" width="196" height="420" fill="#f7faff"/>
    <text x="548" y="92" fill="#1769c2" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">FIGURES / PDF</text>
    <rect x="548" y="119" width="144" height="186" rx="12" fill="#ffffff" stroke="#cbdced"/>
    <rect x="566" y="143" width="108" height="7" rx="3.5" fill="#d7e1ec"/>
    <rect x="566" y="162" width="90" height="7" rx="3.5" fill="#d7e1ec"/>
    <rect x="566" y="191" width="108" height="74" rx="8" fill="#eaf4ff"/>
    <polyline points="578,244 598,229 619,236 642,207 662,219" fill="none" stroke="#1769c2" stroke-width="4" stroke-linecap="round"/>
    <rect x="548" y="331" width="144" height="70" rx="12" fill="#e6f5ee"/>
    <circle cx="570" cy="352" r="6" fill="#1ba36a"/>
    <text x="584" y="357" fill="#1f7250" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">CONTRACT OK</text>
    <text x="566" y="382" fill="#506b88" font-family="Segoe UI, Arial, sans-serif" font-size="12">Source unchanged</text>
  </g>

  <rect x="72" y="540" width="330" height="44" rx="22" fill="#1769c2"/>
  <text x="98" y="569" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.7">LOCAL FIRST · CLOUD OPTIONAL</text>
</svg>
